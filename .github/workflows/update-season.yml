# Every night, fetches this season's results from the EuroLeague API and saves
# season-2026-27.json to the repo when there's a new result.
# It can also be started by hand: Actions tab -> "Update season results" -> Run workflow.
name: Update season results

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily, after the evening's games have ended
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-season

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node update-season.js

      - name: Save the file if it changed
        run: |
          if git diff --quiet -- season-2026-27.json; then
            echo "No changes to save"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add season-2026-27.json
          git commit -m "Update season results"
          git push
