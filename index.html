<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14182b">
<title>מאזן יורוליג</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button type="button" id="lang-btn" class="lang-btn" aria-label="Switch to English">EN</button>
  <div class="top-text">
    <h1 data-i18n="title">מאזן יורוליג</h1>
    <span class="sub" data-i18n="sub">2026-27 מול 2025-26</span>
  </div>
</header>

<main>
  <!-- BALANCE -->
  <section id="view-balance" class="view">
    <p class="intro muted small" data-i18n-html="intro">התוצאות של כל קבוצה ביורוליג 2026-27 בהשוואה לאותם משחקים ב־2025-26:<br><b class="neg"><bdi dir="ltr">+1</bdi></b> על תוצאה טובה יותר, <b class="neg"><bdi dir="ltr">−1</bdi></b> על תוצאה גרועה יותר.<br>בשיקטאש החליפה את מונאקו, ולכן המשחקים מולה מושווים למשחקים מול מונאקו בעונה שעברה.</p>
    <div id="balance-cards"></div>
    <p id="season-status" class="muted small"></p>
  </section>

  <!-- LOOKUP -->
  <section id="view-lookup" class="view" hidden>
    <div class="card">
      <h2 data-i18n="lookupTitle">חיפוש משחק</h2>
      <label class="lbl" data-i18n="team">קבוצה</label>
      <div class="seg" id="lk-team"></div>
      <label class="lbl" for="lk-opp" data-i18n="opponent">יריבה</label>
      <select id="lk-opp"></select>
      <label class="lbl" data-i18n="location">מיקום</label>
      <div class="seg" id="lk-loc"></div>
      <div id="lk-result" class="compare"></div>
    </div>
  </section>

  <!-- TABLE -->
  <section id="view-table" class="view" hidden>
    <div class="seg wide" id="tb-team"></div>
    <div class="seg wide" id="tb-sort"></div>
    <div class="table-wrap">
      <table class="games">
        <thead><tr><th data-i18n="opponent">יריבה</th><th data-i18n-html="homeAway">בית/<br>חוץ</th><th>25-26</th><th>26-27</th><th>±</th></tr></thead>
        <tbody id="tb-body"></tbody>
        <tfoot id="tb-foot"></tfoot>
      </table>
    </div>
  </section>
</main>

<nav class="tabs">
  <button data-view="balance" class="active"><span class="ico">⚖️</span><span data-i18n="tabBalance">מאזן</span></button>
  <button data-view="table"><span class="ico">📋</span><span data-i18n="tabTable">טבלה</span></button>
  <button data-view="lookup"><span class="ico">🔍</span><span data-i18n="tabLookup">חיפוש</span></button>
</nav>

<script src="data-2025-26.js"></script>
<script src="app.js"></script>
</body>
</html>
